name: Auto-Monitor and Fix Workflows

on:
  schedule:
    # Run every hour at minute 0 (2x slower than original 30-min plan per user request)
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no actual fixes)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write         # For git operations and pushing the fix-log branch
  issues: write           # For creating GitHub Issues
  actions: write          # For triggering workflows
  pull-requests: write    # main is ruleset-protected; the fix log lands via PR

env:
  DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
  AUTO_FIX_ENABLED: true  # Set to false to disable auto-fixing

jobs:
  monitor-and-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'

      - name: Auto-discover newsfeed workflows
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Discovering newsfeed workflows..."
          # Allow exit code 1 (indicates failures found, which is expected)
          python scripts/diagnose_workflow_failure.py --json > diagnostic_results.json || true

          # Extract workflow names
          workflows=$(python -c "
          import json
          with open('diagnostic_results.json') as f:
              results = json.load(f)
              workflows = [r['workflow'] for r in results]
              print(','.join(workflows))
          ")

          echo "workflows=$workflows" >> $GITHUB_OUTPUT
          echo "Discovered workflows: $workflows"

      - name: Display diagnostic summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "================================"
          echo "WORKFLOW DIAGNOSTIC SUMMARY"
          echo "================================"
          # Allow exit code 1 (indicates failures found)
          python scripts/diagnose_workflow_failure.py || true
          echo "================================"

      - name: Process failures and apply fixes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Processing failures and applying fixes..."

          # Read diagnostic results
          if [ ! -f diagnostic_results.json ]; then
            echo "No diagnostic results found"
            exit 0
          fi

          # Process each workflow's failures
          python << 'EOF'
          import json
          import subprocess
          import os

          dry_run = os.environ.get('DRY_RUN', 'false').lower() == 'true'
          auto_fix_enabled = os.environ.get('AUTO_FIX_ENABLED', 'true').lower() == 'true'

          if not auto_fix_enabled:
              print("⏸️  Auto-fix is disabled. Only diagnostics will run.")
              exit(0)

          with open('diagnostic_results.json') as f:
              results = json.load(f)

          total_fixes_attempted = 0
          total_fixes_successful = 0

          for workflow_result in results:
              workflow = workflow_result['workflow']
              status = workflow_result['status']

              if status != 'failing':
                  print(f"✅ {workflow}: Healthy, no action needed")
                  continue

              print(f"\n🔍 Processing failures for {workflow}...")

              failures = workflow_result.get('failures', [])
              if not failures:
                  continue

              # Get most recent failure to fix
              recent_failure = failures[0]
              diagnosis = recent_failure['diagnosis']
              failure_type = diagnosis['type']
              fixable = diagnosis['fixable']
              run_id = recent_failure['run_id']

              print(f"  Latest failure: {failure_type} (fixable: {fixable})")

              # Apply fix if possible
              cmd = [
                  'python', 'scripts/autofix_workflow.py',
                  '--workflow', workflow,
                  '--failure-type', failure_type,
                  '--run-id', str(run_id)
              ]

              if dry_run:
                  cmd.append('--dry-run')

              print(f"  Running: {' '.join(cmd)}")
              result = subprocess.run(cmd, capture_output=True, text=True)

              total_fixes_attempted += 1

              if result.returncode == 0:
                  print(f"  ✅ Fix applied successfully")
                  total_fixes_successful += 1
              else:
                  print(f"  ❌ Fix failed or skipped:")
                  print(f"     {result.stdout}")
                  if result.stderr:
                      print(f"     Error: {result.stderr}")

          print(f"\n{'='*60}")
          print(f"SUMMARY: {total_fixes_successful}/{total_fixes_attempted} fixes successful")
          print(f"{'='*60}")
          EOF

      - name: Publish fix attempts log via PR
        if: env.DRY_RUN == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: monitor/fix-log
        run: |
          # main is protected by the "dont push to main" ruleset and this job runs as
          # github-actions[bot], which is not a bypass actor. Publish the log on a single
          # long-lived branch and keep one PR open rather than pushing to main directly.
          if [ ! -f .github/fix_attempts.json ]; then
            echo "No fix attempts log to publish"
            exit 0
          fi

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "Auto-Monitor Bot"

          git add .github/fix_attempts.json

          if git diff --cached --quiet; then
            echo "No changes to fix attempts log"
            exit 0
          fi

          # Rebuild the branch on top of the commit this run checked out, so the PR
          # stays a single commit ahead of main instead of accumulating hourly noise.
          git checkout -b "$BRANCH"
          git commit -m "📊 Update fix attempts log - $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push --force origin "$BRANCH"

          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "✅ Fix attempts log updated on existing PR #${existing}"
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "📊 Monitor Agent: fix attempts log" \
              --body "Automated log of Monitor Agent fix attempts, refreshed on each run. Safe to merge or close - the branch is rebuilt from main every time it changes." \
              --label auto-monitor
            echo "✅ Opened PR for $BRANCH"
          fi

      - name: Report status
        if: always()
        run: |
          echo "Monitor cycle completed at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "Next run: $(date -u -d '+1 hour' +'%Y-%m-%d %H:%M:%S UTC')"
